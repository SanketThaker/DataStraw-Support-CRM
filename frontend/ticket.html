<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Support CRM | Ticket Details</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body
    class="min-h-screen
           bg-slate-50
           text-slate-900">


    <!-- ==========================================
         DESKTOP SIDEBAR
         ========================================== -->

    <aside
        class="hidden lg:flex
               fixed
               left-0
               top-0
               bottom-0
               w-64
               bg-white
               border-r
               border-slate-200
               flex-col
               z-40">


        <!-- BRAND -->

        <div class="px-6 py-7">

            <h1 class="text-xl font-bold">
                Support CRM
            </h1>

            <p class="text-sm text-slate-500 mt-1">
                Support Management
            </p>

        </div>


        <!-- NAVIGATION -->

        <nav class="px-4 space-y-2">

            <a
                href="agent.html"
                class="flex items-center gap-3
                       px-4 py-3
                       rounded-xl
                       text-slate-600
                       hover:bg-slate-100
                       transition">

                <span>▦</span>

                Dashboard

            </a>


            <a
                href="create-ticket.html"
                class="flex items-center gap-3
                       px-4 py-3
                       rounded-xl
                       text-slate-600
                       hover:bg-slate-100
                       transition">

                <span>+</span>

                Create Ticket

            </a>

        </nav>


        <!-- AGENT INFO -->

        <div class="mt-auto p-5">

            <div
                class="bg-slate-50
                       rounded-2xl
                       p-4">

                <p class="text-xs text-slate-500">
                    Signed in as
                </p>

                <p class="font-medium mt-1">
                    Support Agent
                </p>

            </div>

        </div>

    </aside>



    <!-- ==========================================
         MOBILE HEADER
         ========================================== -->

    <header
        class="lg:hidden
               sticky
               top-0
               z-40
               bg-white/90
               backdrop-blur-md
               border-b
               border-slate-200">

        <div
            class="flex
                   items-center
                   justify-between
                   px-5
                   py-4">

            <div>

                <h1 class="font-bold text-lg">
                    Support CRM
                </h1>

                <p class="text-xs text-slate-500">
                    Ticket Details
                </p>

            </div>


            <a
                href="agent.html"
                class="px-4 py-2
                       rounded-xl
                       bg-slate-100
                       text-sm
                       font-medium">

                ← Back

            </a>

        </div>

    </header>



    <!-- ==========================================
         MAIN
         ========================================== -->

    <main class="lg:ml-64 min-h-screen">

        <div
            class="max-w-5xl
                   mx-auto
                   px-5
                   sm:px-8
                   py-8
                   lg:py-10">


            <!-- BACK -->

            <a
                href="agent.html"
                class="inline-flex
                       items-center
                       gap-2
                       text-sm
                       font-medium
                       text-blue-600
                       hover:text-blue-700
                       mb-6">

                ← Back to Dashboard

            </a>



            <!-- ======================================
                 TICKET CARD
                 ====================================== -->

            <div
                class="bg-white
                       border
                       border-slate-200
                       rounded-2xl
                       shadow-sm
                       p-6
                       sm:p-8">


                <!-- ==================================
                     HEADER
                     ================================== -->

                <div
                    class="flex
                           flex-col
                           sm:flex-row
                           sm:items-start
                           sm:justify-between
                           gap-5">


                    <div>


                        <!-- ID + STATUS -->

                        <div
                            class="flex
                                   flex-wrap
                                   items-center
                                   gap-3
                                   mb-3">


                            <span
                                id="ticketId"
                                class="text-sm
                                       font-semibold
                                       text-blue-600">

                                TKT-001

                            </span>


                            <span
                                id="ticketStatus"
                                class="px-3
                                       py-1
                                       rounded-full
                                       text-xs
                                       font-medium
                                       bg-emerald-100
                                       text-emerald-700">

                                Open

                            </span>


                            <!-- PRIORITY BADGE -->

                            <span
                                id="ticketPriority"
                                class="px-3
                                       py-1
                                       rounded-full
                                       text-xs
                                       font-medium
                                       bg-amber-100
                                       text-amber-700">

                                🟡 Medium

                            </span>

                        </div>


                        <!-- SUBJECT -->

                        <h2
                            id="ticketSubject"
                            class="text-2xl
                                   sm:text-3xl
                                   font-bold">

                            Loading ticket...

                        </h2>

                    </div>


                    <!-- DATE -->

                    <span
                        id="ticketDate"
                        class="text-sm
                               text-slate-400">

                    </span>

                </div>



                <!-- ==================================
                     DESCRIPTION
                     ================================== -->

                <div class="mt-8">

                    <h3
                        class="text-sm
                               font-semibold
                               text-slate-500
                               uppercase
                               tracking-wide">

                        Description

                    </h3>


                    <p
                        id="ticketDescription"
                        class="mt-3
                               text-slate-700
                               leading-relaxed">

                    </p>

                </div>



                <!-- ==================================
                     CUSTOMER INFORMATION
                     ================================== -->

                <div
                    class="mt-8
                           pt-6
                           border-t
                           border-slate-100">


                    <h3
                        class="text-sm
                               font-semibold
                               text-slate-500
                               uppercase
                               tracking-wide
                               mb-4">

                        Customer Information

                    </h3>


                    <div
                        class="grid
                               sm:grid-cols-2
                               gap-4">


                        <!-- CUSTOMER NAME -->

                        <div
                            class="bg-slate-50
                                   rounded-xl
                                   p-4">

                            <p
                                class="text-xs
                                       text-slate-500">

                                Customer Name

                            </p>


                            <p
                                id="customerName"
                                class="font-medium
                                       mt-1">

                            </p>

                        </div>


                        <!-- EMAIL -->

                        <div
                            class="bg-slate-50
                                   rounded-xl
                                   p-4">

                            <p
                                class="text-xs
                                       text-slate-500">

                                Email

                            </p>


                            <p
                                id="customerEmail"
                                class="font-medium
                                       mt-1">

                            </p>

                        </div>

                    </div>

                </div>



                <!-- ==================================
                     AGENT ACTIONS
                     ================================== -->

                <div
                    class="mt-8
                           pt-6
                           border-t
                           border-slate-100">


                    <h3
                        class="text-lg
                               font-semibold">

                        Agent Actions

                    </h3>



                    <!-- ==================================
                         STATUS
                         ================================== -->

                    <div class="mt-5">

                        <label
                            for="statusSelect"
                            class="block
                                   text-sm
                                   font-medium
                                   text-slate-700
                                   mb-2">

                            Ticket Status

                        </label>


                        <select
                            id="statusSelect"
                            class="w-full
                                   px-4
                                   py-3
                                   rounded-xl
                                   border
                                   border-slate-200
                                   bg-slate-50
                                   outline-none
                                   focus:ring-2
                                   focus:ring-blue-500
                                   focus:border-blue-500
                                   transition">


                            <option value="Open">
                                🟢 Open
                            </option>


                            <option value="In Progress">
                                🟡 In Progress
                            </option>


                            <option value="Closed">
                                ⚫ Closed
                            </option>

                        </select>

                    </div>



                    <!-- ==================================
                         PRIORITY
                         ================================== -->

                    <div class="mt-5">

                        <label
                            for="prioritySelect"
                            class="block
                                   text-sm
                                   font-medium
                                   text-slate-700
                                   mb-2">

                            Ticket Priority

                        </label>


                        <select
                            id="prioritySelect"
                            class="w-full
                                   px-4
                                   py-3
                                   rounded-xl
                                   border
                                   border-slate-200
                                   bg-slate-50
                                   outline-none
                                   focus:ring-2
                                   focus:ring-blue-500
                                   focus:border-blue-500
                                   transition">


                            <option value="Low">
                                🟢 Low
                            </option>


                            <option value="Medium">
                                🟡 Medium
                            </option>


                            <option value="High">
                                🟠 High
                            </option>


                            <option value="Urgent">
                                🔴 Urgent
                            </option>

                        </select>

                    </div>



                    <!-- ==================================
                         SAVE CHANGES
                         ================================== -->

                    <div
                        class="flex
                               justify-end
                               mt-5">


                        <button
                            id="saveChangesButton"
                            type="button"
                            class="w-full
                                   sm:w-auto
                                   px-6
                                   py-3
                                   rounded-xl
                                   bg-blue-600
                                   text-white
                                   font-semibold
                                   hover:bg-blue-700
                                   hover:-translate-y-0.5
                                   transition-all
                                   disabled:opacity-50
                                   disabled:cursor-not-allowed">

                            Save Changes

                        </button>

                    </div>



                    <!-- ==================================
                         ADD NOTE
                         ================================== -->

                    <div class="mt-8">

                        <label
                            for="noteInput"
                            class="block
                                   text-sm
                                   font-medium
                                   text-slate-700
                                   mb-2">

                            Add Note

                        </label>


                        <textarea
                            id="noteInput"
                            rows="4"
                            placeholder="Write an internal note about this ticket..."
                            class="w-full
                                   px-4
                                   py-3
                                   rounded-xl
                                   border
                                   border-slate-200
                                   bg-slate-50
                                   outline-none
                                   resize-none
                                   focus:ring-2
                                   focus:ring-blue-500
                                   focus:border-blue-500
                                   transition"></textarea>


                        <div
                            class="flex
                                   justify-end
                                   mt-3">


                            <button
                                id="addNoteButton"
                                type="button"
                                class="w-full
                                       sm:w-auto
                                       px-5
                                       py-3
                                       rounded-xl
                                       bg-slate-900
                                       text-white
                                       font-medium
                                       hover:bg-slate-800
                                       hover:-translate-y-0.5
                                       transition-all
                                       disabled:opacity-50
                                       disabled:cursor-not-allowed">

                                Add Note

                            </button>

                        </div>

                    </div>



                    <!-- ==================================
                         NOTES HISTORY
                         ================================== -->

                    <div class="mt-8">


                        <h3
                            class="text-lg
                                   font-semibold">

                            Notes History

                        </h3>


                        <div
                            id="notesList"
                            class="mt-4">

                            <p
                                class="text-sm
                                       text-slate-500">

                                No notes yet.

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    <script src="js/tickets.js"></script>

</body>

</html>
