<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="withd=device-width", initial-scale="1.0">
        <title>DataStraw | Support CRM</title>

        <!---Tailwind CSS-->
        <script src="https://cdn.tailwindcss.com"></script>

        <!---Custom CSS-->
        <script rel="stylesheet" href="css/style.css"></script>
    </head>

    <body class="min-h-screen bg-slate-50 text-slate-900">
        <main class="min-h-screen px-5 py-10 sm:py-16">
            <div class="w-full max-w-5xl mx-auto">
                <div class="text-denter mb-12">
                    <h1 class="text-4xl sn:text-5xl font-bold tracking-tight">
                        Support CRM
                    </h1>
                    <p class="mt-3 text-slate-500 text-lg">
                        Support made simple
                    </p>
                </div>
                <!-- ========================================
                 ROLE SELECTION TITLE
                 ======================================== -->
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-semibold">
                        How Would You Like to Continue
                    </h2>
                    <p class="mt-2 text-slate-500">
                        choose your role to get started
                    </p>
                </div>
                 <!-- ========================================
                 ROLE CARDS
                 ======================================== -->
                 <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-3xl mx-auto">
                    <!-- ====================================
                     CUSTOMER CARD
                     ==================================== -->
                     <button
                        type="button"
                        onclick="selectRole('customer')"
                        class="role-card group text-left bg-white border border-slate-200
                               rounded-3xl p-8 shadow-sm
                               hover:border-blue-300
                               transition-all duration-300
                               focus:outline-none
                               focus:ring-4 focus:ring-blue-100">
                        <!--Icon-->
                        <div class="w-14 h-14 rounded-2xl
                                    bg-blue-50 text-blue-600
                                    flex items-center justify-center
                                    text-2xl mb-6
                                    group-hover:bg-blue-600
                                    group-hover:text-white
                                    transition-colors duration300">
                            👤
                        </div>

                        <!--Title-->

                        <h3 class="text-xl font-semibold">
                            Customer
                        </h3>

                        <!---Description-->

                        <p class="mt-2 text-slate-500 leading-relaxed">
                            Create Support tickets, View your Requests,
                            and track their status
                        </p>

                        <!---Action-->
                        <div class="mt-6 text-blue-600 font-medium
                                    group-hover:translate-x-1
                                    transition-transform duration-300">
                            Continue
                            <span class="ml-1">-></span>
                        </div>
                     </button>
                     
                     <!-- ====================================
                     SUPPORT AGENT CARD
                     ==================================== -->
                     <button
                        type="button"
                        onclick="selectRole('agent')"
                        class="role-card group text-left bg-white border border-slate-200
                               rounded-3xl p-8 shadow-sm
                               hover:shadow-xl hover:-translate-y-1
                               hover:border-blue-300
                               transition-all duration-300
                               focus:outline-none
                               focus:ring-4 focus:ring-blue-100">
                        
                        <!--Icon-->
                        <div class="w-14 h-14 rounded-2xl
                                    bg-slate-100 text-slate-700
                                    flex items-center justify-center
                                    text-xl mb-6
                                    group-hover:bg-slate-900
                                    group-hover:text-white
                                    transition-colors duration-300">
                                🧑‍💻
                        </div>
                        
                        <!--Title-->
                        <h3 class="text-xl font-semibold">
                            Support Agent
                        </h3>

                        <!--Description-->

                        <p class="mt-2 text-slate-500 leading-relaxed">
                            Manage Customer tickets, Update Statuses,
                            and handle Support Requests.
                        </p>
                        <!--Action-->
                        <div class="mt-6 text-blue-600 font-medium
                                    group-hover:translate-x-1
                                    transition-transform duration-300">
                            continue
                            <span class="ml-1">-></span>
                        </div>
                     </button>
                 </div>
                <!-- ========================================
                 FOOTER
                 ======================================== -->

                 <p class="text-center text-xs text-slate-400 mt-10">
                    Support CRM
                 </p>
            </div>
        </main>
        <!--Role Selection JavaScript-->
        <script src="js/role.js"></script>
    </body>
</html>
